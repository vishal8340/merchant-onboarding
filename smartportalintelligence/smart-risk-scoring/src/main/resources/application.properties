server.port=8080
spring.application.name=smart-risk-scoring

# ========== OpenAI LLM Configuration ==========
# Set your API key here or via environment variable OPENAI_API_KEY
# Get your key from: https://platform.openai.com/api-keys
openai.api.key=dial-ftwcbhgzau3w9ogooz3rt9mmdho

# Model to use: gpt-4o-mini (cheap & fast), gpt-4o (best quality), gpt-3.5-turbo (legacy)
openai.model=gpt-4o

# API endpoint (change for Azure OpenAI or other providers)
openai.api.url=https://ai-proxy.lab.epam.com/openai/deployments/gpt-4o/chat/completions

# Auth type: "bearer" for OpenAI, "api-key" for Azure/EPAM proxy
openai.auth.type=api-key

# Timeouts: allow LLM proxy unlimited time to respond
spring.mvc.async.request-timeout=600000
server.tomcat.connection-timeout=600000

# ========== RabbitMQ Configuration ==========
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
rabbitmq.queue.request=merchant.risk.request
rabbitmq.queue.response=merchant.risk.response
rabbitmq.exchange=merchant.risk.exchange
rabbitmq.routing.request=risk.request
rabbitmq.routing.response=risk.response

# ========== Fraud Detection Rules (configurable) ==========
# Rule 1: High chargeback rate
fraud.rules.chargeback-threshold=0.05

# Rule 2: Bust-out pattern (new business + high volume)
fraud.rules.bust-out-max-years=2
fraud.rules.bust-out-min-volume=100000

# Rule 3: Card-not-present fraud (online + high avg txn)
fraud.rules.cnp-min-avg-transaction=500
fraud.rules.cnp-business-type=Online

# Rule 4: AML red flag (low compliance + high volume)
fraud.rules.aml-max-compliance=40
fraud.rules.aml-min-volume=80000

# Rule 5: Shell company (brand new + poor compliance)
fraud.rules.shell-max-years=1
fraud.rules.shell-max-compliance=50

# Rule 6: High-risk industry types
fraud.rules.industry-chargeback-threshold=0.03
fraud.rules.industry-high-risk-types=Travel,Subscription

